name: tests
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  cpu:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    env:
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install (CPU)
        run: |
          python -m pip install --upgrade pip
          python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -e ".[figures]"
      - name: Forecaster and evaluation tests
        run: python -m unittest discover -s tests -t . -v
      - name: Exact properties P1-P19
        run: python -m unittest discover -s theory -t . -v
      - name: Quickstart
        run: python examples/quickstart.py
      - name: Evaluation example
        run: python -m evaluation.run_example
      - name: Figures regenerate from results/
        if: matrix.python-version == '3.11'
        run: python figures/make_figures.py
